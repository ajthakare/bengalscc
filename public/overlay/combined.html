<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>GSCC Combined Stream Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent !important;
      background-color: rgba(0,0,0,0) !important;
      overflow: hidden;
    }

    /* Preview mode: checkered pattern so transparent areas are obvious in browser */
    body.preview-mode {
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%) !important;
      background-size: 40px 40px !important;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0px !important;
      background-color: #e0e0e0 !important;
    }

    /* Chroma key background modes */
    body.bg-green   { background: #00ff00 !important; }
    body.bg-magenta { background: #ff00ff !important; }

    #score-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: none;
      background: transparent;
      pointer-events: none;
      z-index: 2;
    }

    /* Preview badge */
    #preview-badge {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 999;
      pointer-events: none;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const topUrl    = params.get('top');
    const scoreUrl  = params.get('score');
    const isPreview = params.get('preview') === '1';
    const bg        = params.get('bg'); // 'green' | 'magenta' | null

    // Chroma key background
    if (bg === 'green')   document.body.classList.add('bg-green');
    if (bg === 'magenta') document.body.classList.add('bg-magenta');

    // Preview mode: show checkered background so transparent areas are visible
    if (isPreview && !bg) {
      document.body.classList.add('preview-mode');
      const badge = document.createElement('div');
      badge.id = 'preview-badge';
      badge.textContent = 'PREVIEW — checkered = transparent';
      document.body.appendChild(badge);
    }


    async function loadTopOverlay(url) {
      const res = await fetch(url);
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // Inject styles, stripping html/body rules that would conflict with this page
      doc.querySelectorAll('style').forEach(styleEl => {
        const cleaned = styleEl.textContent
          .replace(/html\s*,\s*body\s*\{[^}]*\}/gs, '')
          .replace(/html\s*\{[^}]*\}/gs, '')
          .replace(/body\s*\{[^}]*\}/gs, '');
        const newStyle = document.createElement('style');
        newStyle.textContent = cleaned;
        document.head.appendChild(newStyle);
      });

      // Inject body HTML (position:fixed elements anchor to viewport correctly)
      document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);

      // Re-execute scripts (innerHTML doesn't run them)
      doc.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    }

    async function init() {
      if (!topUrl && !scoreUrl) {
        document.body.innerHTML +=
          '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Arial;font-size:24px;color:red;background:rgba(0,0,0,0.7);padding:20px 40px;border-radius:8px;text-align:center;">No overlay URLs provided.<br>Use /overlay/generator.html to create a combined link.</div>';
        return;
      }

      if (topUrl) {
        try {
          await loadTopOverlay(topUrl);
        } catch (e) {
          console.error('Failed to load top overlay:', e);
        }
      }

      if (scoreUrl) {
        const frame = document.createElement('iframe');
        frame.id = 'score-frame';
        frame.src = scoreUrl;
        frame.setAttribute('allowtransparency', 'true');
        document.body.appendChild(frame);
      }
    }

    init();
  </script>
</body>
</html>
